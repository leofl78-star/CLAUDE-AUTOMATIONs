<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Dopamina e cocaína no núcleo accumbens</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; margin: 0 auto; max-width: 100vw; max-height: 100vh; }
  body.capture canvas { max-width: none; max-height: none; margin: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="src/timeline.js"></script>
<script src="src/sim.js"></script>
<script src="src/draw.js"></script>
<script>
// Pré-visualização: abra este arquivo no navegador. ?format=h mostra a versão horizontal.
// O renderizador (render.js) usa ?capture=1 e chama window.renderFrame(i) quadro a quadro.
(function () {
  const q = new URLSearchParams(location.search);
  const format = q.get('format') === 'h' ? 'h' : 'v';
  const capture = q.has('capture');
  if (capture) document.body.classList.add('capture');
  const canvas = document.getElementById('c');
  const sim = DV.createSim();
  const assets = {};
  const logo = new Image();
  const start = () => {
    const r = DV.createRenderer(canvas, format, assets);
    window.renderFrame = (i) => { sim.seekFrame(i); r.render(sim); };
    window.frameData = (i) => { window.renderFrame(i); return canvas.toDataURL('image/jpeg', 0.96); };
    window.ready = true;
    if (capture) return;
    const t0 = performance.now() - (parseFloat(q.get('t')) || 0) * 1000;
    (function loop() {
      const t = ((performance.now() - t0) / 1000) % DV.T.DURATION;
      window.renderFrame(Math.floor(t * DV.T.FPS));
      requestAnimationFrame(loop);
    })();
  };
  logo.onload = () => { assets.logo = logo; start(); };
  logo.onerror = start;
  logo.src = 'assets/logo.png';
})();
</script>
</body>
</html>
